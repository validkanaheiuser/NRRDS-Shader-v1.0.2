name: Build Audio Bridge Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK 29.0.14206865
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zip unzip git curl make

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Module
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Compute version info
      id: version
      run: |
        VER_CODE=$(git rev-list --count HEAD)
        VER_NAME="v3.1.${VER_CODE}"
        echo "ver_code=${VER_CODE}" >> $GITHUB_OUTPUT
        echo "ver_name=${VER_NAME}" >> $GITHUB_OUTPUT

    - name: Rename module zip with version
      run: |
        cp build/audio-bridge-module.zip build/audio-bridge-module-${{ steps.version.outputs.ver_name }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: audio-bridge-module
        path: zygisk/module/
        if-no-files-found: error

    - name: Create GitHub Release and update update.json
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VER_NAME="${{ steps.version.outputs.ver_name }}"
        VER_CODE="${{ steps.version.outputs.ver_code }}"

        # Delete existing release with same tag if it exists (re-push to same commit count)
        gh release delete "${VER_NAME}" --yes 2>/dev/null || true
        git push origin --delete "refs/tags/${VER_NAME}" 2>/dev/null || true

        # Create release and upload zip
        gh release create "${VER_NAME}" \
          --title "Audio Bridge ${VER_NAME}" \
          --notes "Automated build from commit $(git rev-parse --short HEAD)" \
          "build/audio-bridge-module.zip#audio-bridge-module.zip"

        # Update update.json to point to this release
        ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VER_NAME}/audio-bridge-module.zip"
        CHANGELOG_URL="https://github.com/${{ github.repository }}/releases/tag/${VER_NAME}"
        cat > update.json << EOF
        {
          "version": "${VER_NAME}",
          "versionCode": ${VER_CODE},
          "zipUrl": "${ZIP_URL}",
          "changelog": "${CHANGELOG_URL}"
        }
        EOF

        # Commit update.json and keystore back to main.
        # The keystore is committed on first run so all future builds reuse the same
        # signing key. A fresh key each build causes PackageManager to see a signature
        # conflict between the priv-app overlay (new key) and any existing data-app
        # install (old key), crashing system_server during early boot (boot loop).
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add update.json
        if git status --porcelain app/audiobridge.keystore | grep -q '^??'; then
          git add app/audiobridge.keystore
        fi
        git diff --cached --quiet || git commit -m "chore: update update.json for ${VER_NAME} [skip ci]"
        git push

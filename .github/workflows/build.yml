name: Build Audio Bridge Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK 29.0.14206865
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zip unzip git curl make

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Module
      env:
        AUDIO_BRIDGE_KEYSTORE_B64: ${{ secrets.AUDIO_BRIDGE_KEYSTORE_B64 }}
        AUDIO_BRIDGE_KEYSTORE_PASS: ${{ secrets.AUDIO_BRIDGE_KEYSTORE_PASS }}
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Compute version info
      id: version
      run: |
        VER_CODE=$(git rev-list --count HEAD)
        VER_NAME="v4.0.${VER_CODE}"
        ZIP_NAME="audio-bridge-${VER_NAME}.zip"
        echo "ver_code=${VER_CODE}" >> $GITHUB_OUTPUT
        echo "ver_name=${VER_NAME}" >> $GITHUB_OUTPUT
        echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

    - name: Rename module zip with version
      run: |
        cp build/audio-bridge-module.zip "build/${{ steps.version.outputs.zip_name }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: audio-bridge-${{ steps.version.outputs.ver_name }}
        path: build/${{ steps.version.outputs.zip_name }}
        if-no-files-found: error

    - name: Create GitHub Release and update update.json
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VER_NAME="${{ steps.version.outputs.ver_name }}"
        VER_CODE="${{ steps.version.outputs.ver_code }}"
        ZIP_NAME="${{ steps.version.outputs.zip_name }}"
        SHORT_SHA=$(git rev-parse --short HEAD)

        # Delete existing release with same tag if it exists
        gh release delete "${VER_NAME}" --yes 2>/dev/null || true
        git push origin --delete "refs/tags/${VER_NAME}" 2>/dev/null || true

        # Create release and upload versioned zip
        gh release create "${VER_NAME}" \
          --title "Audio Bridge ${VER_NAME}" \
          --notes "$(printf 'Automated build from commit %s\n\n**Flash via KernelSU Manager:**\n1. Download `%s`\n2. KernelSU → Install → select zip → reboot' "${SHORT_SHA}" "${ZIP_NAME}")" \
          "build/${ZIP_NAME}#${ZIP_NAME}"

        # Update update.json
        ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VER_NAME}/${ZIP_NAME}"
        CHANGELOG_URL="https://github.com/${{ github.repository }}/releases/tag/${VER_NAME}"
        cat > update.json << EOF
        {
          "version": "${VER_NAME}",
          "versionCode": ${VER_CODE},
          "zipUrl": "${ZIP_URL}",
          "changelog": "${CHANGELOG_URL}"
        }
        EOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add update.json
        git diff --cached --quiet || git commit -m "chore: update update.json for ${VER_NAME} [skip ci]"
        # Retry push up to 3 times in case of concurrent CI pushes
        for i in 1 2 3; do
          git pull --rebase origin main && git push && break
          echo "Push attempt $i failed, retrying..."
          sleep 5
        done
